name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: All studies on the committed 300-person sample
        run: python experiments/run_all.py --sample
      - name: Batch command on an example table
        run: |
          python -m ortholab.cli template patients.csv
          python -m ortholab.cli batch patients.csv --out outputs/batch --vent-rows 4
          python -m ortholab.cli batch patients.csv --out outputs/segmented --segmented --plantar-stop 5
      - run: pytest
